name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build
      - run: ./target/debug/let-interop --help
      - run: ./target/debug/let-interop check --in fixtures/dxf/rect.dxf --expect fixtures/dxf/rect.json
